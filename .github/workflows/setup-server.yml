name: Setup Server

# Only run manually or when ansible provisioning files change
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - testing
          - production
      setup_certificates:
        description: "Obtain Let's Encrypt certificates and enable HTTPS on this server"
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'ansible/playbooks/setup-server.yml'
      - 'ansible/playbooks/templates/env.j2'
      - 'ansible/inventory.yml'
      - 'ansible/ansible.cfg'
      - 'ansible/requirements.yml'
      - 'scripts/deploy.sh'
      - 'nginx/**'

jobs:
  setup-testing:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'testing'
    runs-on: [self-hosted]
    environment: testing
    steps:
      - uses: actions/checkout@v7

      - name: Install self-hosted runner tools
        uses: ./.github/actions/bootstrap-self-hosted-tools

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run setup-server playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL_HASH_SECRET: ${{ secrets.EMAIL_HASH_SECRET }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
          LOGIN_CODE_EXPIRY_MINUTES: ${{ secrets.LOGIN_CODE_EXPIRY_MINUTES }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
          PASSWORD_RESET_EXPIRY_MINUTES: ${{ secrets.PASSWORD_RESET_EXPIRY_MINUTES }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          ansible-playbook playbooks/setup-server.yml \
            --limit testing \
            -e "server_ip=$SERVER_HOST" \
            -e "server_user=$SERVER_USER" \
            -e "ghcr_user=${{ github.actor }}" \
            -e "deploy_dir=$DEPLOY_DIR" \
            -e "domain=$DOMAIN" \
            -e "certbot_email=$CERTBOT_EMAIL" \
            -e "setup_certificates=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.setup_certificates || false }}" \
            -e "postgres_password=$POSTGRES_PASSWORD" \
            -e "postgres_user=$POSTGRES_USER" \
            -e "postgres_db=$POSTGRES_DB" \
            -e "secret_key=$SECRET_KEY" \
            -e "admin_email=$ADMIN_EMAIL" \
            -e "admin_password=$ADMIN_PASSWORD" \
            -e "email_hash_secret=$EMAIL_HASH_SECRET" \
            -e "mail_username=$MAIL_USERNAME" \
            -e "mail_password=$MAIL_PASSWORD" \
            -e "mail_from=$MAIL_FROM" \
            -e "mail_from_name=$MAIL_FROM_NAME" \
            -e "mail_server=$MAIL_SERVER" \
            -e "mail_port=$MAIL_PORT" \
            -e "telegram_token=$TELEGRAM_TOKEN" \
            -e "admin_chat_id=$ADMIN_CHAT_ID" \
            -e "mini_app_url=$MINI_APP_URL" \
            -e "grafana_user=$GRAFANA_USER" \
            -e "grafana_password=$GRAFANA_PASSWORD" \
            -e "app_environment=$ENVIRONMENT" \
            -e "cors_origins=$CORS_ORIGINS" \
            -e "login_code_expiry_minutes=$LOGIN_CODE_EXPIRY_MINUTES" \
            -e "password_reset_expiry_minutes=$PASSWORD_RESET_EXPIRY_MINUTES" \
            --private-key /home/deploy/.ssh/deploy
      - name: Bootstrap infrastructure (first deploy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${DEPLOY_DIR:-/home/deploy/iu-alumni}"
            if [ -f "$DEPLOY_DIR/.env" ]; then set -a && . "$DEPLOY_DIR/.env" && set +a; fi

            REPO_DIR="$DEPLOY_DIR/infra"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR" && git fetch origin && git reset --hard origin/${{ github.ref_name }}
            else
              git clone -b ${{ github.ref_name }} \
                https://github.com/${{ github.repository }}.git "$REPO_DIR"
            fi

            chmod +x "$REPO_DIR/scripts/deploy.sh"
            DEPLOY_DIR="$DEPLOY_DIR" "$REPO_DIR/scripts/deploy.sh" deploy

  setup-production:
    if: >
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted]
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Install self-hosted runner tools
        uses: ./.github/actions/bootstrap-self-hosted-tools

      - name: Install Ansible collections
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run setup-server playbook
        working-directory: ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          DOMAIN: ${{ secrets.DOMAIN }}
          EMAIL_HASH_SECRET: ${{ secrets.EMAIL_HASH_SECRET }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
          LOGIN_CODE_EXPIRY_MINUTES: ${{ secrets.LOGIN_CODE_EXPIRY_MINUTES }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
          PASSWORD_RESET_EXPIRY_MINUTES: ${{ secrets.PASSWORD_RESET_EXPIRY_MINUTES }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          ansible-playbook playbooks/setup-server.yml \
            --limit production \
            -e "server_ip=$SERVER_HOST" \
            -e "server_user=$SERVER_USER" \
            -e "ghcr_user=${{ github.actor }}" \
            -e "deploy_dir=$DEPLOY_DIR" \
            -e "domain=$DOMAIN" \
            -e "certbot_email=$CERTBOT_EMAIL" \
            -e "setup_certificates=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.setup_certificates || false }}" \
            -e "postgres_password=$POSTGRES_PASSWORD" \
            -e "postgres_user=$POSTGRES_USER" \
            -e "postgres_db=$POSTGRES_DB" \
            -e "secret_key=$SECRET_KEY" \
            -e "admin_email=$ADMIN_EMAIL" \
            -e "admin_password=$ADMIN_PASSWORD" \
            -e "email_hash_secret=$EMAIL_HASH_SECRET" \
            -e "mail_username=$MAIL_USERNAME" \
            -e "mail_password=$MAIL_PASSWORD" \
            -e "mail_from=$MAIL_FROM" \
            -e "mail_from_name=$MAIL_FROM_NAME" \
            -e "mail_server=$MAIL_SERVER" \
            -e "mail_port=$MAIL_PORT" \
            -e "telegram_token=$TELEGRAM_TOKEN" \
            -e "admin_chat_id=$ADMIN_CHAT_ID" \
            -e "mini_app_url=$MINI_APP_URL" \
            -e "grafana_user=$GRAFANA_USER" \
            -e "grafana_password=$GRAFANA_PASSWORD" \
            -e "app_environment=$ENVIRONMENT" \
            -e "cors_origins=$CORS_ORIGINS" \
            -e "login_code_expiry_minutes=$LOGIN_CODE_EXPIRY_MINUTES" \
            -e "password_reset_expiry_minutes=$PASSWORD_RESET_EXPIRY_MINUTES" \
            --private-key /home/deploy/.ssh/deploy
      - name: Bootstrap infrastructure (first deploy)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            DEPLOY_DIR="${DEPLOY_DIR:-/home/deploy/iu-alumni}"
            if [ -f "$DEPLOY_DIR/.env" ]; then set -a && . "$DEPLOY_DIR/.env" && set +a; fi

            REPO_DIR="$DEPLOY_DIR/infra"
            if [ -d "$REPO_DIR/.git" ]; then
              cd "$REPO_DIR" && git fetch origin && git reset --hard origin/main
            else
              git clone -b main \
                https://github.com/${{ github.repository }}.git "$REPO_DIR"
            fi

            chmod +x "$REPO_DIR/scripts/deploy.sh"
            DEPLOY_DIR="$DEPLOY_DIR" "$REPO_DIR/scripts/deploy.sh" deploy
