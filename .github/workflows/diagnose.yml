name: Diagnose server

# ─────────────────────────────────────────────────────────────────────────────
# Read-only diagnostics for a deployment server. Runs on the self-hosted runner
# (inside the private network) and prints host/Docker/Swarm/stack/nginx state so
# deployment failures can be debugged without direct SSH access to the VM.
#
# SAFETY: this workflow NEVER prints secret values.
#   • .env is shown with every value redacted (keys only).
#   • Nothing is modified — all commands are read-only queries.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - testing
          - production
      service:
        description: 'Optional: docker service name to fetch logs for (e.g. iu_alumni_backend_backend)'
        required: false
        type: string
      tail:
        description: 'Log lines to tail per service'
        required: false
        type: string
        default: '80'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted]
    environment: ${{ inputs.environment }}
    steps:
      # The public hostnames sit behind the university's Angie ingress, which
      # only serves clients inside the corporate network. The self-hosted runner
      # IS inside it, so this is the only place the endpoints can be verified.
      # Hostnames derive from the DOMAIN secret, so they print masked (***) —
      # each line is labelled by role instead.
      - name: Check public endpoints from inside the network
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          set +e
          echo "── endpoint reachability (via ingress, from inside network) ──"
          for entry in "app:${DOMAIN}" "api:api.${DOMAIN}" "mobile:mobile.${DOMAIN}" \
                       "admin:admin.${DOMAIN}" "grafana:grafana.${DOMAIN}" "portainer:portainer.${DOMAIN}"; do
            role="${entry%%:*}"; host="${entry#*:}"
            code=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "https://${host}/" 2>/dev/null)
            printf '  %-10s https -> %s\n' "$role" "${code:-no-response}"
          done

      - name: Collect diagnostics over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 5m
          envs: DEPLOY_DIR,SVC,TAIL
          script: |
            set +e
            # The deploy user's login shell is zsh and this is a non-interactive
            # session, so PATH is not reliably populated for later commands.
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:$PATH"
            echo "══════════ HOST ══════════"
            uname -a; grep PRETTY_NAME /etc/os-release; uptime
            echo; echo "══════════ DISK / MEM ══════════"
            df -h / | tail -2; free -h | head -2

            echo; echo "══════════ DOCKER SERVICE STATUS ══════════"
            systemctl is-active docker; systemctl status docker --no-pager -l 2>&1 | head -25

            echo; echo "══════════ DOCKER DAEMON JOURNAL (last 60) ══════════"
            (sudo -n journalctl -xeu docker.service --no-pager -n 60 2>/dev/null \
              || journalctl -xeu docker.service --no-pager -n 60 2>&1 | head -60 \
              || echo "journalctl unavailable (needs sudo)")

            echo; echo "══════════ DOCKER / SWARM ══════════"
            docker version 2>&1 | head -12
            echo "-- swarm state --"; docker info --format '{{.Swarm.LocalNodeState}} (manager={{.Swarm.ControlAvailable}})' 2>&1
            echo "-- nodes --"; docker node ls 2>&1 | head -5

            echo; echo "══════════ STACKS / SERVICES ══════════"
            docker stack ls 2>&1
            docker service ls 2>&1

            echo; echo "══════════ SERVICE TASKS (failures visible here) ══════════"
            for s in $(docker service ls --format '{{.Name}}' 2>/dev/null); do
              echo "--- $s"
              docker service ps --no-trunc --format '{{.Name}} {{.CurrentState}} {{.Error}}' "$s" 2>&1 | head -6
            done

            echo; echo "══════════ LOGS ══════════"
            # Application logs can contain credentials (e.g. a bot token inside a
            # request URL). These repos are public, so Actions logs are public too.
            # Only dump logs when explicitly asked, and scrub obvious secrets.
            redact() {
              sed -E \
                -e 's#bot[0-9]{5,}:[A-Za-z0-9_-]{20,}#bot<REDACTED>#g' \
                -e 's#(password|passwd|token|secret|api[_-]?key|authorization)([=:"[:space:]]+)[^"[:space:],]+#\1\2<REDACTED>#gI' \
                -e 's#(https?://)[^:/@[:space:]]+:[^@[:space:]]+@#\1<REDACTED>@#g'
            }
            if [ -n "$SVC" ]; then
              echo "--- docker service logs $SVC (tail $TAIL, secrets scrubbed)"
              docker service logs --tail "$TAIL" "$SVC" 2>&1 | tail -"$TAIL" | redact
            else
              echo "(skipped — pass the 'service' input to dump logs for one service)"
              echo "Task state above already shows crash/restart errors without log contents."
            fi

            echo; echo "══════════ DEPLOY DIR ══════════"
            ls -la "$DEPLOY_DIR" 2>&1 | head -20

            echo; echo "══════════ .env KEYS (values redacted) ══════════"
            if [ -f "$DEPLOY_DIR/.env" ]; then
              sed -E 's/=.*/=<redacted>/' "$DEPLOY_DIR/.env" | sort
            else
              echo "NO .env at $DEPLOY_DIR/.env"
            fi

            echo; echo "══════════ NGINX CONFIGS (server_name shows active domain) ══════════"
            ls -la "$DEPLOY_DIR/nginx/conf.d" 2>&1 | head -15
            grep -h -E "server_name|proxy_pass" "$DEPLOY_DIR"/nginx/conf.d/*.conf 2>/dev/null | head -25

            echo; echo "══════════ LOCAL HTTP CHECKS ══════════"
            for p in 80 443; do
              printf 'localhost:%s (no Host) -> ' "$p"
              curl -s -o /dev/null -m 5 -w '%{http_code}\n' "http://localhost:$p/" 2>&1 || echo "no answer"
            done
            # Definitive per-vhost check: nginx routes by Host header, so a hostless
            # request only proves the default server. Probe each vhost by name to
            # confirm the app behind it actually answers on this box.
            echo "-- per-vhost (Host header -> nginx on :80) --"
            DOM=$(grep -E '^DOMAIN=' "$DEPLOY_DIR/.env" 2>/dev/null | cut -d= -f2- | tr -d '"'"'"'')
            if [ -n "$DOM" ]; then
              for entry in "app:${DOM}" "api:api.${DOM}" "mobile:mobile.${DOM}" \
                           "admin:admin.${DOM}" "grafana:grafana.${DOM}" "portainer:portainer.${DOM}"; do
                role="${entry%%:*}"; host="${entry#*:}"
                code=$(curl -s -o /dev/null -m 8 -w '%{http_code}' -H "Host: ${host}" "http://localhost/" 2>/dev/null)
                printf '  %-10s -> %s\n' "$role" "${code:-no-response}"
              done
              # The API root often has no route (404 from the app itself, which still
              # proves nginx->backend works; a broken proxy would give 502/504).
              # Probe real API paths to confirm the backend is actually serving.
              echo "-- api paths (Host: api.\$DOMAIN) --"
              for path in /docs /openapi.json /health /api/v1/health; do
                code=$(curl -s -o /dev/null -m 8 -w '%{http_code}' -H "Host: api.${DOM}" "http://localhost${path}" 2>/dev/null)
                printf '  %-18s -> %s\n' "$path" "${code:-no-response}"
              done
            else
              echo "  (DOMAIN not readable from .env)"
            fi

            echo; echo "══════════ INGRESS PATH ══════════"
            # The public hostnames resolve to the university's Angie ingress, which
            # answers 403 externally. The question this section settles is whether
            # Angie forwards to us at all: if our nginx never logs a request from
            # the ingress, the request is being refused upstream of us.
            echo "-- what is listening on 80/443 --"
            (ss -lntp 2>/dev/null || netstat -lntp 2>/dev/null) | grep -E ':(80|443) ' | head -6

            echo "-- nginx request sources (last 2000 log lines, by client IP) --"
            # Access logs go to stdout, so they come from the service log. Query
            # strings are stripped: verification links carry ?token=... and these
            # repos are public.
            docker service logs --tail 2000 iu_alumni_infra_nginx 2>&1 \
              | sed -E 's/\?[^ "]*/?<scrubbed>/g' \
              | grep -oE '^[^|]*\| *[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort | uniq -c | sort -rn | head -10 \
              || echo "  (no client IPs parsed from nginx logs)"

            echo "-- recent nginx requests (scrubbed) --"
            docker service logs --tail 40 iu_alumni_infra_nginx 2>&1 \
              | sed -E 's/\?[^ "]*/?<scrubbed>/g' | tail -15

            echo "-- can this server reach its own public hostname (through the ingress)? --"
            if [ -n "$DOM" ]; then
              for host in "$DOM" "api.$DOM"; do
                printf '  https://%s -> ' "$host"
                curl -s -o /dev/null -m 15 -w '%{http_code} (server: %{scheme})\n' "https://${host}/" 2>&1 \
                  || echo "no answer"
              done
              echo "  -- same hostname, but straight at our own nginx --"
              for host in "$DOM" "api.$DOM"; do
                printf '  Host:%s -> localhost:80 -> ' "$host"
                curl -s -o /dev/null -m 10 -w '%{http_code}\n' -H "Host: ${host}" http://localhost/ 2>&1
              done
            fi

            echo; echo "══════════ APT LOCK HOLDERS (if setup-server fails) ══════════"
            ps -eo pid,etime,cmd 2>/dev/null | grep -E '[a]pt|[d]pkg' | head -5 || echo "none"
            echo; echo "════════ END OF DIAGNOSTICS ════════"
        env:
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
          SVC: ${{ inputs.service }}
          TAIL: ${{ inputs.tail }}
