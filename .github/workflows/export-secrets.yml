name: Export environment secrets

on:
  workflow_dispatch:
    inputs:
      passphrase:
        description: GPG passphrase used to encrypt the export
        required: true
        type: password

permissions:
  contents: read

concurrency:
  group: export-secrets
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: [testing, production]
    environment: ${{ matrix.environment }}
    env:
      ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
      CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
      DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
      DOMAIN: ${{ secrets.DOMAIN }}
      EMAIL_HASH_SECRET: ${{ secrets.EMAIL_HASH_SECRET }}
      ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
      GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
      GRAFANA_USER: ${{ secrets.GRAFANA_USER }}
      LOGIN_CODE_EXPIRY_MINUTES: ${{ secrets.LOGIN_CODE_EXPIRY_MINUTES }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_FROM_NAME: ${{ secrets.MAIL_FROM_NAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_SERVER: ${{ secrets.MAIL_SERVER }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MINI_APP_URL: ${{ secrets.MINI_APP_URL }}
      PASSWORD_RESET_EXPIRY_MINUTES: ${{ secrets.PASSWORD_RESET_EXPIRY_MINUTES }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - name: Write .env export
        shell: python
        env:
          MATRIX_ENV: ${{ matrix.environment }}
        run: |
          import os

          names = [
              "ADMIN_CHAT_ID", "ADMIN_EMAIL", "ADMIN_PASSWORD", "CERTBOT_EMAIL",
              "CORS_ORIGINS", "DEPLOY_DIR", "DOMAIN", "EMAIL_HASH_SECRET",
              "ENVIRONMENT", "GRAFANA_PASSWORD", "GRAFANA_USER",
              "LOGIN_CODE_EXPIRY_MINUTES", "MAIL_FROM", "MAIL_FROM_NAME",
              "MAIL_PASSWORD", "MAIL_PORT", "MAIL_SERVER", "MAIL_USERNAME",
              "MINI_APP_URL", "PASSWORD_RESET_EXPIRY_MINUTES", "POSTGRES_DB",
              "POSTGRES_PASSWORD", "POSTGRES_USER", "SECRET_KEY", "SERVER_HOST",
              "SERVER_SSH_KEY", "SERVER_USER", "TELEGRAM_TOKEN",
          ]

          def esc(v: str) -> str:
              v = v.replace("\\", "\\\\").replace('"', '\\"')
              v = v.replace("\r", "\\r").replace("\n", "\\n")
              return f'"{v}"'

          env_name = os.environ["MATRIX_ENV"]
          path = f"secrets-{env_name}.env"
          with open(path, "w") as f:
              for n in names:
                  f.write(f"{n}={esc(os.environ.get(n, ''))}\n")
          print(f"Wrote {len(names)} secrets to {path}")

      - name: Encrypt export
        env:
          GPG_PASSPHRASE: ${{ inputs.passphrase }}
        run: |
          set -euo pipefail
          f="secrets-${{ matrix.environment }}.env"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$GPG_PASSPHRASE" \
            --symmetric --cipher-algo AES256 \
            --output "$f.gpg" "$f"
          rm -f "$f"

      - name: Upload encrypted export
        uses: actions/upload-artifact@v4
        with:
          name: secrets-${{ matrix.environment }}
          path: secrets-${{ matrix.environment }}.env.gpg
          retention-days: 1
          if-no-files-found: error
